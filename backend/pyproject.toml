[project]
name = "firecal-backend"
version = "0.1.0"
description = "Database and API for the Wel3a burning-calendar exports (data contract v0.4)"
requires-python = ">=3.12"
# Pure-Python dependencies plus asyncpg/pydantic-core, which load under this machine's
# Application Control policy. pandas and pyarrow are deliberately avoided (both are blocked):
# calendar data is loaded from calendar.csv.gz straight into PostgreSQL with COPY.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "asyncpg>=0.29",
    "python-dotenv>=1.0",
    "duckdb>=1.1",  # reads calendar.parquet (full precision); loads under Application Control, unlike pyarrow
    "google-auth>=2.30",
    "requests>=2.32",
    "httpx2>=2.16",  # the assistant (firecal_api/chat.py) calls OpenRouter with it
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
ml = [
    "numpy>=2.0",
    "scikit-learn>=1.5",
]

[project.scripts]
firecal-db = "firecal_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["firecal_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
