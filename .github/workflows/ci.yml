# Checks every pull request (into main or dev) and every push to dev. Nothing is deployed from here;
# deploying happens in deploy-azure.yml when main changes.
name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      # Electron is only for the desktop app; the website build does not need its ~100 MB binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      VITE_API_URL: https://wel3a-api.blackwave-481696ae.francecentral.azurecontainerapps.io
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build # tsc --noEmit && vite build

  backend:
    name: Backend (tests without a database)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13" # same as backend/Dockerfile
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      # Tests marked `db` need PostgreSQL and are left out. The others use the export files in
      # export/export/ (checked into the repo) and a fake Meteomatics client.
      - run: uv run --frozen python -m pytest -q -m "not db"
