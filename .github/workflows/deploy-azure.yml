# Deploys the app to Azure Container Apps on every push to main.
# Teammates work on `dev` (or feature branches) and open a pull request into main; merging it deploys.
#
# Only the parts that changed are rebuilt: backend/** rebuilds the API, web/** rebuilds the website
# and functions/** or backend/firecal_api/live/** redeploys the live-pipeline functions (a change to this
# file rebuilds everything). "Run workflow" on the Actions tab redeploys everything by hand.
#
# Sign-in uses GitHub's OIDC token with a federated credential on an Azure app registration, so no
# password or key is stored in GitHub. The IDs below are identifiers, not secrets.
# AZURE_CLIENT_ID is printed by infra/azure/setup-github-oidc.sh.
name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-azure
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: 6b937771-9d7d-44f9-b12d-9910439730e2
  AZURE_TENANT_ID: 19c3c702-45a1-4697-919c-5e479f4a4b55
  AZURE_SUBSCRIPTION_ID: 8834278b-93b5-4626-8e51-3de2d007ebc2
  RESOURCE_GROUP: wel3a-rg
  ACR_NAME: wel3abe616acr
  API_APP: wel3a-api
  WEB_APP: wel3a-web
  LIVE_APP: wel3a-live-be616
  OUTLOOK_JOB: phoenical-outlook
  API_URL: https://api.phoenical.earth
  WEB_URL: https://www.phoenical.earth

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      pipeline: ${{ steps.filter.outputs.pipeline }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
      # Compares against the commit main pointed to before this push (the whole merged PR).
      - id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'infra/azure/deploy-outlook-job.py'
              - '.github/workflows/deploy-azure.yml'
            web:
              - 'web/**'
              - '.github/workflows/deploy-azure.yml'
            pipeline:
              - 'functions/**'
              - 'backend/firecal_api/live/**'
              - 'backend/firecal_api/contract.py'
              - 'backend/firecal_api/db.py'
              - '.github/workflows/deploy-azure.yml'

  api:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Build the API image in Azure
        run: |
          az acr build --registry "$ACR_NAME" --platform linux/amd64 \
            --image "firecal-api:${GITHUB_SHA::7}" --image firecal-api:latest backend/
      - name: Roll out the new image
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update -n "$API_APP" -g "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/firecal-api:${GITHUB_SHA::7}" -o none
      # In single-revision mode the old revision keeps serving until the new one is ready, so wait for
      # the new revision first; otherwise the health check could pass against the old one.
      - name: Wait for the new revision
        run: |
          rev=$(az containerapp show -n "$API_APP" -g "$RESOURCE_GROUP" --query properties.latestRevisionName -o tsv)
          for _ in $(seq 1 30); do
            ready=$(az containerapp show -n "$API_APP" -g "$RESOURCE_GROUP" --query properties.latestReadyRevisionName -o tsv)
            if [ "$ready" = "$rev" ]; then echo "revision $rev is ready"; exit 0; fi
            sleep 10
          done
          echo "revision $rev did not become ready (still serving $ready)" >&2
          az containerapp revision show -n "$API_APP" -g "$RESOURCE_GROUP" --revision "$rev" -o jsonc || true
          exit 1
      - name: Check the API answers
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS -m 20 "$API_URL/health"; then echo; exit 0; fi
            sleep 10
          done
          echo "API did not become healthy" >&2; exit 1
      - name: Start the scheduled outlook and verify publication
        run: |
          execution=$(python3 infra/azure/deploy-outlook-job.py \
            "$RESOURCE_GROUP" "$API_APP" "$OUTLOOK_JOB" "$ACR_NAME.azurecr.io/firecal-api:${GITHUB_SHA::7}")
          echo "Outlook execution: $execution"
          for _ in $(seq 1 75); do
            status=$(az containerapp job execution show -g "$RESOURCE_GROUP" -n "$OUTLOOK_JOB" \
              --job-execution-name "$execution" --query properties.status -o tsv || true)
            case "$status" in
              Succeeded)
                curl -fsS -m 20 "$API_URL/regions/lebanon/predictions?model_name=outlook-hgb" \
                  | jq -e '.months | length == 6'
                exit 0 ;;
              Failed|Stopped) echo "Outlook execution $status" >&2; exit 1 ;;
            esac
            sleep 12
          done
          echo "Outlook execution did not finish before verification timed out" >&2; exit 1

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Build the website image in Azure
        run: |
          az acr build --registry "$ACR_NAME" --platform linux/amd64 \
            --build-arg "VITE_API_URL=$API_URL" \
            --image "firecal-web:${GITHUB_SHA::7}" --image firecal-web:latest web/
      - name: Roll out the new image
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update -n "$WEB_APP" -g "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/firecal-web:${GITHUB_SHA::7}" -o none
      - name: Wait for the new revision
        run: |
          rev=$(az containerapp show -n "$WEB_APP" -g "$RESOURCE_GROUP" --query properties.latestRevisionName -o tsv)
          for _ in $(seq 1 30); do
            ready=$(az containerapp show -n "$WEB_APP" -g "$RESOURCE_GROUP" --query properties.latestReadyRevisionName -o tsv)
            if [ "$ready" = "$rev" ]; then echo "revision $rev is ready"; exit 0; fi
            sleep 10
          done
          echo "revision $rev did not become ready (still serving $ready)" >&2
          az containerapp revision show -n "$WEB_APP" -g "$RESOURCE_GROUP" --revision "$rev" -o jsonc || true
          exit 1
      - name: Check the website answers
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS -m 20 -o /dev/null "$WEB_URL/"; then echo "website up"; exit 0; fi
            sleep 10
          done
          echo "website did not come up" >&2; exit 1

  # The live pipeline's Azure Functions (FIRMS poller + stream consumer). The function app, the Event Hubs
  # stream and their settings are created once by infra/azure/setup-live-pipeline.sh.
  pipeline:
    needs: changes
    if: needs.changes.outputs.pipeline == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Package the functions
        run: ./functions/build.sh
      - name: Deploy to the function app
        run: |
          az functionapp deployment source config-zip -g "$RESOURCE_GROUP" -n "$LIVE_APP" \
            --src functions/.build.zip --build-remote true
      - name: Check both functions are registered
        run: |
          for _ in $(seq 1 12); do
            names=$(az functionapp function list -g "$RESOURCE_GROUP" -n "$LIVE_APP" --query "[].name" -o tsv)
            if echo "$names" | grep -q poll_firms && echo "$names" | grep -q harmonize; then echo "$names"; exit 0; fi
            sleep 10
          done
          echo "functions not registered: $names" >&2; exit 1
