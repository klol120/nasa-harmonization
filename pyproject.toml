[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firecal"
version = "0.1.0"
description = "Harmonize MODIS and VIIRS active-fire detections into a burning-activity calendar"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2", "pyarrow>=15", "numpy", "pyyaml", "geopandas>=0.14", "shapely>=2", "pyogrio",
  "requests", "python-dotenv",
]

[project.optional-dependencies]
test = ["pytest>=8"]
tools = ["matplotlib>=3.8"]   # charts in tools/ (thresholds report)

[project.scripts]
firecal = "firecal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
