[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lebanon-firecast"
version = "0.1.0"
description = "Research pipeline for satellite-detected vegetation-fire occurrence"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.8,<4",
    "joblib>=1.3,<2",
    "h5py>=3.16.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "pyhdf>=0.11.7",
    "pyproj>=3.8.0",
    "shapely>=2.2.0",
    "fsspec>=2026.9.0",
    "aiohttp>=3.14.5",
    "h5netcdf>=1.8.3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[project.scripts]
firecast = "firecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
