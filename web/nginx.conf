# Static site: compress text, keep hashed build files for a year, always revalidate the page itself.
server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/geo+json;

    # Vite puts a content hash in every file name under assets/, so a new build never reuses a name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
